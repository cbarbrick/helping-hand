<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helping Hand</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Helping Hand">
<meta name="theme-color" content="#2F6B4F">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#eef4ef;--surface:#fbfdfb;--surface-2:#f3f8f4;--ink:#1d2b23;--ink-muted:#55685d;
  --line:#d3e2d8;--line-strong:#b9d0c2;--brand:#2f6b4f;--brand-dark:#24553f;--brand-soft:#dcece2;
  --accent:#417a61;--accent-soft:#e4f1eb;--warn:#7a5312;--warn-soft:#f7ead1;--danger:#8f342c;--danger-soft:#f8e3e0;
  --gray-tag:#eaefeb;--white:#fff;--shadow:0 2px 12px rgba(36,85,63,.08);
  --pad:16px;--radius:18px;--radius-sm:12px;--tap:48px;
  color-scheme:light;
}
/* Single-look app: the real product is light-only, so the demo commits to it too. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.5;overflow-wrap:break-word;overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
h1{font-size:clamp(26px,1.4rem + 2.2vw,34px);line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:8px 0;text-wrap:balance}
h2{font-size:clamp(20px,1.1rem + 1.2vw,24px);line-height:1.25;font-weight:800;margin:24px 0 8px}
h3{font-size:19px;line-height:1.3;font-weight:700;margin:0 0 4px}
p{margin:0 0 12px}
.muted{color:var(--ink-muted)}.small{font-size:15px;line-height:1.5}
.hint{font-size:15px;line-height:1.5;color:var(--ink-muted);margin-top:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}

/* ---- App shell ---- */
#app{min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.headinner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px var(--pad);max-width:720px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--brand-dark);min-height:44px;background:none;border:0;padding:0;cursor:pointer}
.logo-box{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;flex:none}
.logo-box svg{width:22px;height:28px}
.menubtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--brand-dark);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
nav.menu{display:none;flex-direction:column;border-top:1px solid var(--line);padding:8px var(--pad) 12px;max-width:720px;margin:0 auto;width:100%;gap:2px}
nav.menu.open{display:flex}
nav.menu button{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:10px;border:0;background:none;text-align:left;font-size:17px;font-weight:600;border-radius:10px;cursor:pointer}
nav.menu button:active{background:var(--brand-soft)}
nav.menu .staff{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding:10px 10px 2px;font-weight:700}

.container{max-width:720px;margin:0 auto;width:100%;padding-block:16px calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(var(--pad),env(safe-area-inset-left));padding-right:max(var(--pad),env(safe-area-inset-right));flex:1;display:flex;flex-direction:column}

/* ---- Language switcher ---- */
.langbar{display:flex;gap:4px;flex-wrap:wrap}
.langbar button{min-height:40px;border:1px solid var(--line-strong);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-muted);cursor:pointer}
.langbar button.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---- Components ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card>:first-child{margin-top:0}.card>:last-child{margin-bottom:0}
.card.soft{background:var(--brand-soft);border-color:transparent;box-shadow:none}
.card.warm{background:var(--warn-soft);border-color:transparent;box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);border:2px solid var(--brand);background:var(--brand);color:#fff;padding:12px 22px;border-radius:var(--radius-sm);font-weight:700;font-size:18px;line-height:1.3;cursor:pointer;text-align:center}
.btn.secondary{background:var(--surface);color:var(--brand-dark)}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand-dark)}
.btn.block{width:100%}.btn.lg{font-size:19px;padding:16px 24px;min-height:56px}.btn.small{font-size:15px;padding:8px 14px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn:active:not(:disabled){transform:translateY(1px)}
.stepnav{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:auto calc(-1*var(--pad)) calc(-1*(48px + env(safe-area-inset-bottom,0px)));padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.stepnav .btn{padding:14px 18px;flex:1 1 auto;max-width:62%}.stepnav .btn.ghost{flex:0 1 auto}
.bigchoice{display:grid;gap:12px;margin:16px 0}
.bigchoice button{display:block;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;box-shadow:var(--shadow);width:100%;color:var(--ink)}
.bigchoice .icon{font-size:32px;line-height:1;margin-bottom:8px}
.bigchoice .title{font-size:21px;font-weight:800;line-height:1.25}
.bigchoice .sub{color:var(--ink-muted);font-size:16px;line-height:1.4;margin-top:4px}
.bigchoice button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.bigchoice button.primary .sub{color:#dcece2}
.bigchoice button.accent{background:var(--accent);border-color:var(--accent);color:#fff}.bigchoice button.accent .sub{color:#f0f8f5}
.bigchoice button.sel{border-color:var(--brand);background:var(--brand-soft)}
.bigchoice.inline button{display:flex;align-items:center;gap:16px;padding:16px 20px}.bigchoice.inline .icon{font-size:30px;margin:0;flex:none}.bigchoice.inline .title{font-size:18px}.bigchoice.inline .sub{font-size:14px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.quick button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:84px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.quick .icon{font-size:26px;line-height:1}.quick .title{font-weight:700;font-size:15px;line-height:1.25;margin-top:4px}.quick .sub{color:var(--ink-muted);font-size:13px}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.yesno button{min-height:72px;padding:20px 12px;font-size:22px;font-weight:800;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.yesno button.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:12px}
.chips.tight{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.chips button{min-height:var(--tap);padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:16px;line-height:1.3;cursor:pointer;text-align:center}
.chips button .icon{display:block;font-size:24px;line-height:1;margin-bottom:4px}
.chips button.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.chips button.all{grid-column:1/-1}
label.field,.field{display:block;margin-top:12px;font-weight:700;font-size:16px;line-height:1.4}
input[type=text],input[type=tel],input[type=date],input[type=password],select,textarea{width:100%;min-height:var(--tap);padding:12px 14px;border:2px solid var(--line-strong);border-radius:var(--radius-sm);background:#fff;margin-top:8px;font-size:18px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--brand-dark) 50%),linear-gradient(135deg,var(--brand-dark) 50%,transparent 50%);background-position:calc(100% - 20px) calc(50% + 2px),calc(100% - 14px) calc(50% + 2px);background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}
label.check{display:flex;gap:12px;align-items:flex-start;margin-top:12px;min-height:44px;font-weight:600;font-size:16px;line-height:1.45;cursor:pointer}
label.check input{width:26px;height:26px;margin-top:2px;flex:none;accent-color:var(--brand)}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:12px 16px;background:var(--surface-2);border-left:4px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:15px;line-height:1.5;color:var(--ink-muted)}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px}
.progress div{height:100%;background:var(--brand);transition:width .3s}
.resource{border-top:1px solid var(--line);padding:12px 0}.resource:first-of-type{border-top:0;padding-top:0}.resource:last-of-type{padding-bottom:0}
.resource .name{font-weight:800;font-size:18px;line-height:1.3}
.resource .call{display:inline-flex;align-items:center;gap:8px;min-height:56px;margin-top:8px;background:var(--brand);color:#fff;padding:12px 20px;border-radius:var(--radius-sm);font-weight:800;font-size:19px}
.script{background:var(--bg);border-left:4px solid var(--brand);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-style:italic;margin-top:12px;font-size:16px;line-height:1.5}
.casenum{font-size:26px;font-weight:800;letter-spacing:.05em;line-height:1.2;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:13px;font-weight:700;line-height:1.4;padding:5px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);margin-right:4px;margin-top:4px}
.tag.warm{background:var(--warn-soft);color:var(--warn)}.tag.gray{background:var(--gray-tag);color:var(--ink-muted)}
.emergency{font-size:14px;color:var(--ink-muted);text-align:center;margin-top:32px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(34px,10vw,46px);letter-spacing:.16em;font-weight:800;text-align:center;padding:16px;background:var(--surface);border:3px dashed var(--brand);border-radius:var(--radius);color:var(--brand-dark)}
.status-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.status-steps div{text-align:center;font-size:13px;line-height:1.25;font-weight:700;padding:8px 4px;border-radius:10px;background:var(--gray-tag);color:var(--ink-muted)}
.status-steps div.done{background:var(--brand);color:#fff}
.pickup-box{margin-top:12px;background:#fff;border:2px solid var(--brand);border-radius:var(--radius-sm);padding:12px 16px}
.pickup-code{font-size:clamp(30px,9vw,38px);font-weight:900;letter-spacing:.12em;color:var(--brand-dark)}
.docsteps{display:grid;gap:12px}
.sigpad{position:relative;margin-top:8px}
.sigpad canvas{width:100%;height:160px;background:#fff;border:2px dashed var(--brand);border-radius:var(--radius-sm);touch-action:none;display:block}
.sigpad-hint{position:absolute;top:50%;left:0;right:0;text-align:center;transform:translateY(-50%);color:var(--ink-muted);pointer-events:none;font-size:18px}
.sigpad-clear{position:absolute;right:8px;bottom:8px;background:var(--surface)}
.msg{cursor:pointer}.msg.unread{border-left:5px solid var(--brand)}
.prow{display:grid;grid-template-columns:1fr;gap:0;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.45}
.prow span{color:var(--ink-muted)}
@media(min-width:560px){.prow{grid-template-columns:minmax(120px,210px) 1fr;gap:8px}}
.psheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;margin-top:12px}
.sigimg{max-width:320px;height:auto;border-bottom:2px solid var(--ink);margin-top:8px;display:block}
.demo-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:6px;vertical-align:middle}
.photo-thumb{width:96px;height:72px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}

/* ---- Splash ---- */
.splash{flex:1;min-height:100%;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));cursor:pointer;background:linear-gradient(160deg,#24553f 0%,#2f6b4f 45%,#417a61 100%);color:#fff;text-align:center}
.splash-inner{max-width:640px}
.splash-logo svg{width:60px;height:150px}
.splash-brand{font-size:clamp(24px,1.4rem + 2vw,30px);font-weight:800;letter-spacing:-.01em;margin-bottom:16px}
.splash-fade{opacity:0;transition:opacity .6s ease}.splash-fade.in{opacity:1}
.splash h1{color:#fff;font-size:clamp(24px,1.3rem + 2.2vw,30px);margin:0 0 12px}
.splash-list{list-style:none;padding:0;margin:4px auto 24px;max-width:540px;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;text-align:left}
.splash-list li{color:#f0f8f4;font-size:17px;line-height:1.4;padding-left:20px;position:relative}
.splash-list li::before{content:"•";position:absolute;left:2px;color:#fff;font-weight:800}
@media(max-width:460px){.splash-list{grid-template-columns:1fr}}
.splash-tap{display:inline-flex;align-items:center;min-height:var(--tap);background:rgba(13,40,28,.3);border:1px solid rgba(255,255,255,.5);padding:12px 22px;border-radius:999px;font-weight:700;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.splash-dots{margin-top:24px;display:flex;gap:6px;justify-content:center}
.splash-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.splash-dots span.on{background:#fff}
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.langgrid button{min-height:72px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center;box-shadow:var(--shadow)}
.langgrid .native{display:block;font-size:19px;font-weight:800;line-height:1.3}.langgrid .english{display:block;font-size:13px;color:var(--ink-muted);margin-top:2px}

/* ---- Kiosk mode ---- */
.kiosk{font-size:clamp(18px,1rem + .6vw,22px)}
.kiosk h1{font-size:clamp(28px,1.6rem + 3vw,44px)}
.kiosk .bigchoice .title{font-size:clamp(21px,1.1rem + 1.4vw,28px)}
.kiosk .btn{min-height:64px}
.kiosk .chips button{min-height:64px;font-size:clamp(17px,1rem + .3vw,20px)}

/* ---- Add-to-home-screen helper ---- */
.a2hs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.a2hs strong{display:block;font-size:15px}
.a2hs button{margin-left:auto;background:transparent;border:0;color:#fff;font-size:20px;line-height:1;padding:0 4px;cursor:pointer;flex:none}
@media(prefers-reduced-motion:reduce){.splash-tap{animation:none}*{transition-duration:.01ms!important}}
</style>
</head>

  ${c.sig ? `<img class="sigimg" src="${c.sig}" alt="Signature">` : `<p class="small muted" style="margin-top:8px">✍️ ${t("navSigned")} ${fmtDT(c.signedAt)} (finger signature on file)</p>`}
  <h2>${t("navLetter")}</h2>
  <div class="psheet"><p class="small" style="margin:0 0 8px">To whom it may concern — Florida DHSMV / Tax Collector</p><p class="small" style="margin:0 0 8px">Helping Hand certifies that <strong>${esc(name)}</strong>, born ${c.dob ? fmtDate(c.dob + "T00:00:00") : "—"}, is experiencing homelessness in Miami-Dade County (${c.area || "North Miami"}${c.landmark ? ", " + esc(c.landmark) : ""}) and has no fixed address. Helping Hand receives mail on this person's behalf at the address above under a signed authorization dated ${fmtDate(c.signedAt)}. We request the fee exemption for a Florida identification card under s. 322.051(9), F.S.</p><p class="small" style="margin:0">Charlotte Barbrick, Founder · Helping Hand · 410-553-1618</p></div>
  <h2>${t("navFiles")}</h2><div class="row">${c.photos.length ? c.photos.map(p => `<span class="tag">📎 ${esc(p)}</span>`).join("") : `<span class="small muted">—</span>`}</div>
  <h2>Authorizations</h2><div class="row"><span class="tag">✅ Mail authorization — ${t("navSigned")}</span><span class="tag">✅ Representative authorization — ${t("navSigned")}</span></div>`;
}

// ---------- Kiosk ----------
ROUTES.kiosk = () => {
  const o = S.order;
  if (S.kioskScreen === "code" && o) {
    const mins = Math.max(0, 20 - Math.round((Date.now() - o.at) / 60000));
    const idx = Math.min(3, Math.floor((Date.now() - o.at) / 8000)); // demo: advances every 8 seconds
    return `<h1>${t("kioskCode")}</h1><div class="code">${o.code}</div><p style="margin-top:16px">${t("kioskArriving", {n: mins})}</p><p class="muted">${t("kioskShowCode")}</p><div class="status-steps">${["requested","packing","en_route","delivered"].map((s, i) => `<div class="${i <= idx ? "done" : ""}">${t("status_" + s)}</div>`).join("")}</div><div class="stepnav"><button class="btn ghost" id="k-home">← ${t("back")}</button></div>`;
  }
  if (S.kioskScreen === "status") return `<h1>${t("enterCode")}</h1><input type="text" id="k-lookup" autocapitalize="characters" maxlength="6" style="font-size:32px;letter-spacing:.2em;text-align:center" aria-label="${t("enterCode")}"><p class="error small" id="k-nf" hidden style="color:var(--danger);font-weight:600">${t("notFound")}</p><div class="stepnav"><button class="btn ghost" id="k-home">← ${t("back")}</button><button class="btn lg" id="k-check">${t("check")}</button></div>`;
  if (S.kioskScreen === "inbox") return `<div class="row between"><h1>${t("inbox")}</h1>${S.user ? `<button class="btn secondary" id="k-done">${t("doneSignOut")}</button>` : ""}</div>${S.user ? `<p class="muted">${t("kioskInboxWarn")}</p>${inboxList()}` : `<p class="muted">${t("signInIntro")}</p>${pinLogin(true)}`}<div class="stepnav"><button class="btn ghost" id="k-home">← ${t("back")}</button></div>`;
  if (S.kioskScreen === "docs") return `<div class="row between"><h1>${t("docsMine")}</h1>${S.user ? `<button class="btn secondary" id="k-done">${t("doneSignOut")}</button>` : ""}</div>${S.user ? `<p class="muted">${t("kioskInboxWarn")}</p>${docSteps(S.docCase || DEMO_CASES[0], true)}` : `<p class="muted">${t("docsIntro")}</p>${pinLogin(true)}`}<div class="stepnav"><button class="btn ghost" id="k-home">← ${t("back")}</button></div>`;
  return `${langbarFull()}<h1>${t("kioskTitle")}</h1><p class="muted">${t("kioskQuestion")}</p><div class="bigchoice">
    <button class="primary" data-go="kioskOrder"><div class="icon">🥫👕</div><div class="title">${t("kioskYes")}</div><div class="sub">${t("foodClothesNowSub")}</div></button>
    <button class="accent" id="k-help"><div class="icon">🙋</div><div class="title">${t("kioskHelp")}</div><div class="sub">${t("helpingMyselfSub")}</div></button>
    <button data-kscreen="docs"><div class="icon">🪪</div><div class="title">${t("docsHome")}</div><div class="sub">${t("docsHomeSub")}</div></button>
    <button data-kscreen="inbox"><div class="icon">📬</div><div class="title">${t("kioskInbox")}</div><div class="sub">${t("kioskInboxSub")}</div></button>
    <button data-kscreen="status"><div class="icon">🔎</div><div class="title">${t("kioskStatus")}</div></button>
  </div><p class="emergency">${t("emergency")}</p>`;
};
AFTER.kiosk = () => {
  view.querySelectorAll("[data-kscreen]").forEach(b => b.onclick = () => { S.kioskScreen = b.dataset.kscreen; render(); });
  const h = $("#k-home"); if (h) h.onclick = () => { S.kioskScreen = "home"; render(); };
  const kh = $("#k-help"); if (kh) kh.onclick = () => startIntake(false);
  const kd = $("#k-done"); if (kd) kd.onclick = () => { S.user = null; S.kioskScreen = "home"; render(); };
  if ($("#pin-go")) wirePin(() => render());
  const ck = $("#k-check"); if (ck) ck.onclick = () => { const v = $("#k-lookup").value.trim().toUpperCase(); if (S.order && v === S.order.code) { S.kioskScreen = "code"; render(); } else if (v === "TQ917") { S.order = { code: "TQ917", at: Date.now() - 40000 }; S.kioskScreen = "code"; render(); } else $("#k-nf").hidden = false; };
  if (S.kioskScreen === "code") { clearTimeout(S.kioskTimer); S.kioskTimer = setTimeout(() => { if (S.route === "kiosk" && S.kioskScreen === "code") render(); }, 8000); }
  const lk = $("#k-lookup"); if (lk) lk.oninput = () => lk.value = lk.value.toUpperCase();
};
ROUTES.kioskOrder = () => {
  const o = S.orderDraft || (S.orderDraft = { food: true, clothes: false, hygiene: false, top: "", bottom: "", shoes: "" });
  return `<h1>${t("kioskQuestion")}</h1><div class="chips"><button class="${o.food ? "sel" : ""}" data-tog="food"><span class="icon">🥫</span>${t("kioskFood")}</button><button class="${o.clothes ? "sel" : ""}" data-tog="clothes"><span class="icon">👕</span>${t("kioskClothes")}</button><button class="${o.hygiene ? "sel" : ""}" data-tog="hygiene"><span class="icon">🧼</span>${t("kioskHygiene")}</button></div>
  ${o.clothes ? `<div class="card" style="margin-top:14px"><label class="field">${t("sizeTop")}</label><div class="chips tight">${["S","M","L","XL","2XL","3XL"].map(s => `<button class="${o.top === s ? "sel" : ""}" data-size="top" data-val="${s}">${s}</button>`).join("")}</div><label class="field">${t("sizeBottom")}</label><div class="chips tight">${["28","30","32","34","36","38","40","42+"].map(s => `<button class="${o.bottom === s ? "sel" : ""}" data-size="bottom" data-val="${s}">${s}</button>`).join("")}</div><label class="field">${t("sizeShoes")}</label><div class="chips tight">${["6","7","8","9","10","11","12","13+"].map(s => `<button class="${o.shoes === s ? "sel" : ""}" data-size="shoes" data-val="${s}">${s}</button>`).join("")}</div></div>` : ""}
  <div class="stepnav"><button class="btn ghost" data-go="kiosk">← ${t("back")}</button><button class="btn lg accent" id="k-order" ${(o.food || o.clothes || o.hygiene) ? "" : "disabled"}>${t("kioskPlace")} →</button></div>`;
};
AFTER.kioskOrder = () => {
  const o = S.orderDraft;
  view.querySelectorAll("[data-tog]").forEach(b => b.onclick = () => { o[b.dataset.tog] = !o[b.dataset.tog]; render(); });
  view.querySelectorAll("[data-size]").forEach(b => b.onclick = () => { o[b.dataset.size] = b.dataset.val; render(); });
  $("#k-order").onclick = () => { S.order = { code: mkCode(), at: Date.now(), items: { ...o } }; S.orderDraft = null; S.kioskScreen = "code"; navigate("kiosk"); };
};

// ---------- Inbox ----------
function inboxList() { return S.inbox.length ? S.inbox.map((m, i) => `<div class="card msg ${m.unread ? "unread" : ""}" data-msg="${i}"><div class="row between nowrap"><strong>${esc(m.from)}</strong><span class="small muted">${esc(m.when)}</span></div><div style="font-weight:700;margin-top:4px">${esc(m.subject)}</div><p class="small muted" style="margin:6px 0 0">${esc(m.body)}</p></div>`).join("") : `<p class="muted">${t("inboxEmpty")}</p>`; }
ROUTES.inbox = () => `<h1>${t("inbox")}</h1><p class="muted">${t("inboxIntro")}</p>${S.user ? `<p class="small muted">${t("signedInAs", {name: esc(S.user.name)})} · <button class="btn ghost small" id="ib-out">${t("signOut")}</button></p>${inboxList()}` : `<p class="small">${t("signInIntro")}</p>${pinLogin(false)}`}`;
AFTER.inbox = () => { if ($("#pin-go")) wirePin(() => render()); view.querySelectorAll("[data-msg]").forEach(c => c.onclick = () => { S.inbox[+c.dataset.msg].unread = false; render(); }); const o = $("#ib-out"); if (o) o.onclick = () => { S.user = null; render(); }; };

// ---------- Jobs: search + category chips, urgent / no-experience tags, one-tap apply ----------
const TAG_LABEL = x => ({ noid: t("tagNoId"), noaddress: t("tagNoAddress"), sameday: t("tagSameDay"), urgent: t("tagUrgent"), noexp: t("tagNoExp") })[x];
function jobMatches(j) {
  const q = (S.jobQ || "").trim().toLowerCase();
  const cat = JOB_CATS.find(c => c[0] === j.cat);
  const hay = [j.title, j.company, j.area, j.shifts, cat ? cat[2] : "", j.cat, ...j.tags.map(TAG_LABEL)].join(" ").toLowerCase();
  if (q && !q.split(/\s+/).every(w => hay.includes(w))) return false;
  if (S.jobCat && S.jobCat !== "urgent" && j.cat !== S.jobCat) return false;
  if (S.jobCat === "urgent" && !j.tags.includes("urgent")) return false;
  return true;
}
ROUTES.jobs = () => {
  const shown = DEMO_JOBS.map((j, i) => [j, i]).filter(([j]) => jobMatches(j));
  return `<h1>${t("jobsTitle")}</h1><p class="muted">${t("jobsIntro")}</p>
  <input type="text" id="job-q" placeholder="${t("jobsSearch")}" value="${esc(S.jobQ || "")}" aria-label="${t("jobsSearch")}" autocomplete="off" style="margin-top:0">
  <div class="chips" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))"><button class="${!S.jobCat ? "sel" : ""}" data-cat="">${t("jobsAll")}</button><button class="${S.jobCat === "urgent" ? "sel" : ""}" data-cat="urgent">⚡ ${t("jobsUrgentOnly")}</button>${JOB_CATS.map(([k, icon, label]) => `<button class="${S.jobCat === k ? "sel" : ""}" data-cat="${k}">${icon} ${esc(label)}</button>`).join("")}</div>
  <p class="small muted" style="margin:14px 0 8px">${t("jobsCount", {n: shown.length})}</p>
  ${shown.length ? shown.map(([j, i]) => `<div class="card"><div class="row between nowrap"><div><h3 style="margin:0">${esc(j.title)}</h3><div class="small muted">${esc(j.company)} · ${esc(j.area)}</div></div><strong style="white-space:nowrap;color:var(--brand-dark)">${j.pay}</strong></div><div style="margin-top:6px">${j.tags.map(x => `<span class="tag ${x === "urgent" ? "warm" : ""}">${x === "urgent" ? "⚡ " : ""}${TAG_LABEL(x)}</span>`).join("")}</div><p class="small muted" style="margin:8px 0 10px">${esc(j.shifts)}</p>${S.applied.has(i) ? `<p class="small" style="color:var(--brand-dark);font-weight:700;margin:0">✅ ${t("applied")}</p>` : `<button class="btn small" data-apply="${i}">${t("apply")} →</button>`}</div>`).join("") : `<div class="card"><p class="muted" style="margin:0">${t("jobsNone")}</p></div>`}
  <p class="hint">${t("jobsApplyNote")}</p>`;
};
AFTER.jobs = () => {
  const q = $("#job-q"); q.oninput = () => { S.jobQ = q.value; const pos = q.selectionStart; render(); const nq = $("#job-q"); nq.focus(); nq.setSelectionRange(pos, pos); };
  view.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.jobCat = b.dataset.cat; render(); });
  view.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => { const j = DEMO_JOBS[+b.dataset.apply]; S.applied.add(+b.dataset.apply); S.inbox.unshift({ from: j.company, when: "Just now", unread: true, subject: `${j.title}: can you start this week?`, body: `We got your application through Helping Hand. Come by any weekday morning, ask for the manager, and say Helping Hand sent you. ${j.tags.includes("noid") ? "No ID needed to start." : "Bring any ID you have; we can help with the rest."}` }); render(); });
};

// ---------- Admin / partner report ----------
ROUTES.admin = () => `<h1>${t("adminTitle")}</h1><p class="muted">${t("adminIntro")}</p><div class="card soft"><div class="small muted">Period</div><strong>${REPORT.period}</strong></div><div class="card">${REPORT.rows.map(([k, v]) => `<div class="prow"><span>${k}</span><strong>${v}</strong></div>`).join("")}</div><div class="card"><h3>Resource map</h3><p class="small muted">${RESOURCES.length} entries across ${[...new Set(RESOURCES.map(r => r.need))].length} needs, every one a real Miami-Dade or federal service.</p><div>${[...new Set(RESOURCES.map(r => r.need))].map(n => `<span class="tag">${NEED_ICONS[n]} ${t("need_" + n)} · ${RESOURCES.filter(r => r.need === n).length}</span>`).join("")}</div></div><div class="card"><h3>Kiosks</h3><div class="prow"><span>${KIOSK.code}</span><strong>${KIOSK.name} — ${KIOSK.address}</strong></div></div>`;

// ---------- Add-to-home-screen hint ----------
(function a2hs() {
  const ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua), android = /android/i.test(ua);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  let dismissed = false; try { dismissed = localStorage.getItem("hh-a2hs") === "1"; } catch {}
  if ((ios || android) && !standalone && !dismissed) {
    $("#a2hs-title").textContent = t("a2hsTitle"); $("#a2hs-body").textContent = ios ? t("a2hsIos") : t("a2hsAndroid");
    setTimeout(() => { $("#a2hs").hidden = false; }, 6000);
  }
  $("#a2hs-x").onclick = () => { $("#a2hs").hidden = true; try { localStorage.setItem("hh-a2hs", "1"); } catch {} };
})();

paintLangbar();

</script>
</body>
</html>
